kind = "web"
previewPath = "/"
title = "Scheme Postings"
version = "1.0.0"
id = "artifacts/postings"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20962

[services.development]
run = "pnpm --filter @workspace/postings run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/postings", "run", "build" ]
publicDir = "artifacts/postings/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20962"
BASE_PATH = "/"
